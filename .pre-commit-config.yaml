# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.2
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-error-list-sync
        name: Validate error-list.md sync with exceptions.py
        entry: python scripts/check_error_list_sync.py
        language: python
        pass_filenames: false
        files: ^(app/core/exceptions\.py|docs/error-list\.md)$

      - id: pytest
        name: Run unit tests
        entry: .venv/Scripts/pytest.exe
        args: [--ignore=tests/integration, --ignore=tests/test_audio_tasks.py, -q]
        language: script
        pass_filenames: false
        stages: [pre-push]

      - id: safety-check
        name: Security vulnerability check
        entry: .venv/Scripts/safety.exe
        args: [check]
        language: script
        pass_filenames: false
        stages: [pre-push]